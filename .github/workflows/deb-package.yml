name: Debian package

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      filename:
        type: string
        required: true
      version:
        type: string
      release-date:
        type: string

permissions:
  contents: read

concurrency:
  group: deb-package-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DEB_FILE: ${{ inputs.filename || format('JustConnect-preview-{0}-linux-x64.deb', github.sha) }}

jobs:
  package:
    name: Build, install and launch .deb on Debian 13
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build with Debian 13 system Qt
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.release-date }}
        run: |
          docker run --rm -v "$PWD":/justconnect -w /justconnect debian:13 \
            bash scripts/build-debian-package.sh "$VERSION" "$DEB_FILE" "$RELEASE_DATE"

      - name: Clean install and launch the packaged application
        run: |
          docker run --rm -v "$PWD":/justconnect:ro -w /justconnect debian:13 \
            bash scripts/verify-debian-package.sh "$DEB_FILE" "$GITHUB_SHA"

      - name: Upload the verified package
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          archive: false
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.DEB_FILE }}

      - name: Confirm uploaded package digest
        env:
          UPLOADED_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          expected=$(sha256sum "$DEB_FILE" | cut -d' ' -f1)
          test "${UPLOADED_DIGEST#sha256:}" = "$expected"
