name: Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-26.04, qt_host: linux, qt_arch: linux_gcc_64}
          - {os: windows-2025, qt_host: windows, qt_arch: win64_msvc2022_64}
          - {os: macos-26, qt_host: mac, qt_arch: clang_64}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libevent-dev libminizip-dev

      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}

      - name: Build and verify core
        uses: ./.github/actions/build-core

      - name: Verify integrated Go module and complete tests
        run: python scripts/test-corelib.py

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DNIGHTLY_BUILD=ON "-DGIT_HASH=$(git rev-parse --short=7 HEAD)"

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Verify installed Windows runtime with the Qt protocol host
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
          CGO_ENABLED: '1'
          GOEXPERIMENT: cgocheck2
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOENV: 'off'
        run: |
          $destination = Join-Path (Get-Location) 'build/runtime-check'
          cmake --install build --config Release --component CoreRuntime --prefix $destination
          if ($LASTEXITCODE -ne 0) { throw 'Runtime installation failed' }
          Copy-Item build/Release/coreengineui_test.exe $destination
          $env:JC_NATIVE_PROTOCOL_HOST = Join-Path $destination 'coreengineui_test.exe'
          go -C corelib test -mod=readonly -count=1 -timeout 60s -run '^TestNativeProtocolHost$' -v ./internal/bridge
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime protocol test failed' }
