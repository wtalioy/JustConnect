name: Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, qt_host: windows, qt_arch: win64_msvc2022_64}
          - {os: macos-26, qt_host: mac, qt_arch: clang_64}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify local macOS signing without external credentials
        if: runner.os == 'macOS'
        run: python3 tests/macos_signing_smoke.py

      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}

      - name: Prepare Go and cgo toolchain
        uses: ./.github/actions/setup-core-toolchain

      - name: Verify integrated Go module and complete tests
        run: python scripts/test-corelib.py

      - name: Verify source export and package validation
        run: python -m unittest discover -s tests -p '*_test.py'

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DNIGHTLY_BUILD=ON "-DGIT_HASH=$(git rev-parse --short=7 HEAD)"

      - name: Build and verify native sign-in
        shell: bash
        run: |
          cmake --build build --config Release --target coreengineui_test --parallel 3
          ctest --test-dir build --build-config Release --output-on-failure --tests-regex '^coreengineui_test_browser$'

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure --exclude-regex '^coreengineui_test_browser$'
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Verify installed Windows runtime with the Qt protocol host
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          CGO_ENABLED: '1'
          GOEXPERIMENT: cgocheck2
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOENV: 'off'
        run: |
          $destination = Join-Path (Get-Location) 'build/runtime-check'
          cmake --install build --config Release --component CoreRuntime --prefix $destination
          if ($LASTEXITCODE -ne 0) { throw 'Runtime installation failed' }
          Copy-Item build/Release/windows_dnssnapshot_test.exe $destination
          & (Join-Path $destination 'windows_dnssnapshot_test.exe') --native
          if ($LASTEXITCODE -ne 0) { throw 'Installed native DNS reader failed' }
          Copy-Item build/Release/coreengineui_test.exe $destination
          $env:JC_NATIVE_PROTOCOL_HOST = Join-Path $destination 'coreengineui_test.exe'
          go -C corelib test -mod=readonly -count=1 -timeout 60s -run '^TestNativeProtocolHost$' -v ./internal/bridge
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime protocol test failed' }

      - name: Upload native UI layouts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: UI-${{ runner.os }}-${{ runner.arch }}
          path: build/ui-report
          if-no-files-found: ignore

      - name: Diagnose macOS window test crash
        if: failure() && runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
          QT_SCALE_FACTOR: '1.5'
        run: |
          find ~/Library/Logs/DiagnosticReports -name 'mainwindow_test*.ips' -print -exec cat {} \;
          export JC_UI_REPORT_DIR="$RUNNER_TEMP/window-crash"
          mkdir -p "$JC_UI_REPORT_DIR"
          lldb --batch -o run -k 'thread backtrace' -- build/mainwindow_test --profile-language
