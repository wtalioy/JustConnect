name: Core ABI

on:
  push:
    branches: [develop]
    paths: ['.gitattributes', 'tests/coreabi/**', 'tests/embeddedcoreengine_test.cpp', 'infrastructure/coreengine/**', 'infrastructure/settings/**', 'infrastructure/platform/**', 'application/**', 'presentation/**', 'core/**', 'tests/coreengineui_test.cpp', 'tests/credentialstorefixture.h', 'tests/CoreEngineTests.cmake', 'cmake/**', '.github/actions/setup-core-toolchain/**', 'corelib/**', 'scripts/generate-core-abi.py', 'tests/platform/**', '.github/workflows/coreabi.yml', '.github/actions/setup-qt/**']
  pull_request:
    branches: [main, develop]
    paths: ['.gitattributes', 'tests/coreabi/**', 'tests/embeddedcoreengine_test.cpp', 'infrastructure/coreengine/**', 'infrastructure/settings/**', 'infrastructure/platform/**', 'application/**', 'presentation/**', 'core/**', 'tests/coreengineui_test.cpp', 'tests/credentialstorefixture.h', 'tests/CoreEngineTests.cmake', 'cmake/**', '.github/actions/setup-core-toolchain/**', 'corelib/**', 'scripts/generate-core-abi.py', 'tests/platform/**', '.github/workflows/coreabi.yml', '.github/actions/setup-qt/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, platform: windows, arch: x64, qt_host: windows, qt_arch: win64_msvc2022_64}
          - {os: windows-11-vs2026-arm, platform: windows, arch: arm64, qt_host: windows_arm64, qt_arch: win64_msvc2022_arm64}
          - {os: macos-26-intel, platform: macos, arch: x64, qt_host: mac, qt_arch: clang_64}
          - {os: macos-26, platform: macos, arch: arm64, qt_host: mac, qt_arch: clang_64}
          - {os: ubuntu-26.04, platform: linux, arch: x64, qt_host: linux, qt_arch: linux_gcc_64}
          - {os: ubuntu-26.04-arm, platform: linux, arch: arm64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libevent-dev libminizip-dev gsettings-desktop-schemas gnome-keyring dbus-daemon dbus-bin libglib2.0-bin libkf6config-bin

      - uses: ./.github/actions/setup-qt
        with:
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}

      - uses: ./.github/actions/setup-core-toolchain

      - name: Probe Windows device broker in the disposable runner
        if: runner.os == 'Windows'
        shell: python
        run: |
          import hashlib, io, json, os, pathlib, shutil, subprocess, urllib.request, zipfile
          output = pathlib.Path('build/coreabi').resolve()
          sdk = output / 'wintun-probe'
          sdk.mkdir(parents=True, exist_ok=True)
          with urllib.request.urlopen('https://www.wintun.net/builds/wintun-0.14.1.zip', timeout=30) as response:
              data = response.read(16 * 1024 * 1024 + 1)
          digest = hashlib.sha256(data).hexdigest()
          if len(data) > 16 * 1024 * 1024 or digest != '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51':
              raise RuntimeError('Unexpected Wintun archive')
          arch = {'X64': 'amd64', 'ARM64': 'arm64'}[os.environ['RUNNER_ARCH']]
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              dll = sdk / 'wintun.dll'
              dll.write_bytes(archive.read(f'wintun/bin/{arch}/wintun.dll'))
              (output / 'windows-device-license.txt').write_bytes(archive.read('wintun/LICENSE.txt'))
          host = shutil.which('pwsh')
          if not host:
              raise RuntimeError('CI PowerShell host unavailable')
          env = dict(os.environ, JC_TEST_PWSH=host, JC_TEST_WINTUN_DLL=str(dll), CGO_ENABLED='0', GOTOOLCHAIN='local', GOWORK='off', GOENV='off')
          print('RUN: Wintun Authenticode via the CI pwsh host (60s)', flush=True)
          signature = json.loads(subprocess.check_output([host, '-NoProfile', '-NonInteractive', '-Command',
              '$s=Get-AuthenticodeSignature -LiteralPath $env:JC_TEST_WINTUN_DLL; @{status=$s.Status.ToString(); signer=$s.SignerCertificate.Thumbprint} | ConvertTo-Json -Compress'], env=env, text=True, timeout=60))
          if signature != {'status': 'Valid', 'signer': 'DF98E075A012ED8C86FBCF14854B8F9555CB3D45'}:
              raise RuntimeError(f'Untrusted Wintun signature: {signature}')
          metadata = {'archive_sha256': digest, 'version': '0.14.1', 'arch': arch, 'signature': signature, 'powershell_host': host, 'source': os.environ['GITHUB_SHA']}
          (output / 'windows-device.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          source = pathlib.Path('tests/platform/windows_device_probe.go').resolve()
          tests = pathlib.Path('tests/platform/windows_device_probe_test.go').resolve()
          if subprocess.check_output(['gofmt', '-l', str(source), str(tests)], env=env).strip():
              raise RuntimeError('Unformatted device probe')
          subprocess.run(['go', '-C', 'corelib', 'vet', str(source), str(tests)], env=env, check=True, timeout=120)
          probe, unit = output / 'windows-device-probe.exe', output / 'windows-device-unit.exe'
          subprocess.run(['go', '-C', 'corelib', 'build', '-mod=readonly', '-o', str(probe), str(source)], env=env, check=True, timeout=120)
          subprocess.run(['go', '-C', 'corelib', 'test', '-mod=readonly', '-c', '-o', str(unit), str(source), str(tests)], env=env, check=True, timeout=120)
          log_path = output / 'windows-device.log'
          with log_path.open('w', encoding='utf-8') as log:
              try:
                  for args in ([str(unit), '-test.v'], [str(probe), str(dll)]):
                      result = subprocess.run(args, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=300)
                      if result.returncode:
                          raise RuntimeError(f'Device probe failed: {result.returncode}')
              finally:
                  log.flush()
                  print(log_path.read_text(encoding='utf-8', errors='replace'), flush=True)

      - name: Verify formal C ABI, protocol session and authentication
        timeout-minutes: 20
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          output = pathlib.Path('build/coreabi')
          output.mkdir(parents=True, exist_ok=True)
          def run(name, args):
              sys.stdout.buffer.write(('RUN: ' + name + '\n').encode())
              sys.stdout.buffer.flush()
              with (output / (name + '.log')).open('wb') as log:
                  with subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT) as process:
                      for chunk in iter(lambda: process.stdout.read1(4096), b''):
                          log.write(chunk)
                          log.flush()
                          sys.stdout.buffer.write(chunk)
                          sys.stdout.buffer.flush()
                      status = process.wait()
              if status:
                  sys.exit(status)
          run('go', ['go', 'version'])
          run('cgo-env', ['go', 'env', 'GOHOSTOS', 'GOHOSTARCH', 'CC', 'CGO_ENABLED'])
          run('cc', [os.environ['CC'], '--version'])
          run('constants', [sys.executable, 'scripts/generate-core-abi.py', '--check'])
          run('go-test', ['go', '-C', 'corelib', 'test', '-json', '-timeout', '90s', './...'])
          if not (os.environ['RUNNER_OS'] == 'Windows' and os.environ['RUNNER_ARCH'] == 'ARM64'):
              run('go-race', ['go', '-C', 'corelib', 'test', '-json', '-race', '-timeout', '90s', './...'])
          else:
              print('UNSUPPORTED: Go race detector on Windows ARM64; normal Go and C ABI tests still run', flush=True)
          args = ['cmake', '-S', 'tests/coreabi', '-B', str(output), '-DCMAKE_BUILD_TYPE=Release']
          if sys.platform == 'win32':
              args += ['-A', 'ARM64' if os.environ['RUNNER_ARCH'] == 'ARM64' else 'x64']
          run('configure', args)
          run('build', ['cmake', '--build', str(output), '--config', 'Release', '--parallel', '3', '--verbose'])
          run('host', ['ctest', '--test-dir', str(output), '-C', 'Release', '-V', '--output-on-failure'])

      - name: Check Linux TUN fd transfer and cleanup in an isolated network
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- "$(command -v python)" tests/platform/unix_device_probe.py --uid "$(id -u)" --allocator build/coreabi/linux_tundevice_test 2>&1 | tee build/coreabi/linux-device.log

      - name: Check original Go underlay beneath a competing Linux TUN route
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l tests/platform/original_route_probe.go)"
          go -C corelib vet ../tests/platform/original_route_probe.go
          go -C corelib build -mod=readonly -o ../build/coreabi/original-route-probe ../tests/platform/original_route_probe.go
          sudo unshare --net -- "$(command -v python)" tests/platform/original_route_linux.py --uid "$(id -u)" --probe build/coreabi/original-route-probe --allocator build/coreabi/linux_tundevice_test 2>&1 | tee build/coreabi/linux-original-route.log

      - name: Check owned Linux capture routes and partial recovery in an isolated network
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- build/coreabi/linux_tunroutes_test --isolated 2>&1 | tee build/coreabi/linux-owned-routes.log

      - name: Check macOS utun fd transfer and cleanup in the disposable runner
        if: runner.os == 'macOS'
        shell: bash
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_OS="$RUNNER_OS" "$(command -v python)" tests/platform/unix_device_probe.py --uid "$(id -u)" --allocator build/coreabi/macos_tundevice_test 2>&1 | tee build/coreabi/macos-device.log

      - name: Upload toolchain and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coreabi-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/coreabi/*.log
            build/coreabi/*.txt
            build/coreabi/*.json
            build/coreabi/Testing/Temporary/*.log
