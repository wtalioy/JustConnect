name: Core ABI

on:
  push:
    branches: [develop]
    paths: ['tests/coreabi/**', 'tests/embeddedcoreengine_test.cpp', 'infrastructure/coreengine/**', 'infrastructure/platform/**', 'application/**', 'presentation/**', 'core/connectionsession*', 'core/connectionprofile.h', 'core/connectionerror.h', 'tests/coreengineui_test.cpp', 'tests/CoreEngineTests.cmake', 'cmake/**', '.github/actions/setup-core-toolchain/**', 'corelib/**', 'scripts/generate-core-abi.py', 'tests/platform/**', '.github/workflows/coreabi.yml', '.github/actions/setup-qt/**']
  pull_request:
    branches: [main, develop]
    paths: ['tests/coreabi/**', 'tests/embeddedcoreengine_test.cpp', 'infrastructure/coreengine/**', 'infrastructure/platform/**', 'application/**', 'presentation/**', 'core/connectionsession*', 'core/connectionprofile.h', 'core/connectionerror.h', 'tests/coreengineui_test.cpp', 'tests/CoreEngineTests.cmake', 'cmake/**', '.github/actions/setup-core-toolchain/**', 'corelib/**', 'scripts/generate-core-abi.py', 'tests/platform/**', '.github/workflows/coreabi.yml', '.github/actions/setup-qt/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, platform: windows, arch: x64, qt_host: windows, qt_arch: win64_msvc2022_64}
          - {os: windows-11-vs2026-arm, platform: windows, arch: arm64, qt_host: windows_arm64, qt_arch: win64_msvc2022_arm64}
          - {os: macos-26-intel, platform: macos, arch: x64, qt_host: mac, qt_arch: clang_64}
          - {os: macos-26, platform: macos, arch: arm64, qt_host: mac, qt_arch: clang_64}
          - {os: ubuntu-26.04, platform: linux, arch: x64, qt_host: linux, qt_arch: linux_gcc_64}
          - {os: ubuntu-26.04-arm, platform: linux, arch: arm64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libevent-dev libminizip-dev gsettings-desktop-schemas

      - uses: ./.github/actions/setup-qt
        with:
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}

      - uses: ./.github/actions/setup-core-toolchain

      - name: Verify formal C ABI, protocol session and authentication
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          output = pathlib.Path('build/coreabi')
          output.mkdir(parents=True, exist_ok=True)
          def run(name, args):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (output / (name + '.log')).write_bytes(result.stdout)
              sys.stdout.buffer.write(result.stdout)
              sys.stdout.buffer.flush()
              if result.returncode:
                  sys.exit(result.returncode)
          run('go', ['go', 'version'])
          run('cgo-env', ['go', 'env', 'GOHOSTOS', 'GOHOSTARCH', 'CC', 'CGO_ENABLED'])
          run('cc', [os.environ['CC'], '--version'])
          run('constants', [sys.executable, 'scripts/generate-core-abi.py', '--check'])
          run('go-test', ['go', '-C', 'corelib', 'test', '-timeout', '90s', './...'])
          if not (os.environ['RUNNER_OS'] == 'Windows' and os.environ['RUNNER_ARCH'] == 'ARM64'):
              run('go-race', ['go', '-C', 'corelib', 'test', '-race', '-timeout', '90s', './...'])
          else:
              print('UNSUPPORTED: Go race detector on Windows ARM64; normal Go and C ABI tests still run', flush=True)
          args = ['cmake', '-S', 'tests/coreabi', '-B', str(output), '-DCMAKE_BUILD_TYPE=Release']
          if sys.platform == 'win32':
              args += ['-A', 'ARM64' if os.environ['RUNNER_ARCH'] == 'ARM64' else 'x64']
          run('configure', args)
          run('build', ['cmake', '--build', str(output), '--config', 'Release', '--parallel', '3'])
          run('host', ['ctest', '--test-dir', str(output), '-C', 'Release', '-V', '--output-on-failure'])

      - name: Check Linux TUN fd transfer and cleanup in an isolated network
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- "$(command -v python)" tests/platform/linux_device_probe.py --uid "$(id -u)" | tee build/coreabi/linux-device.log

      - name: Upload toolchain and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coreabi-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/coreabi/*.log
            build/coreabi/*.txt
            build/coreabi/*.json
            build/coreabi/Testing/Temporary/*.log
