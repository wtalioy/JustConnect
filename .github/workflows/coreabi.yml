name: Core ABI

on:
  push:
    branches: [develop]
    paths: &coreabi_paths ['.gitattributes', 'tests/coreabi/**', 'tests/embeddedcoreengine_test.cpp', 'infrastructure/**', 'application/**', 'presentation/**', 'core/**', 'tests/coreengineui_test.cpp', 'tests/credentialstorefixture.h', 'tests/CoreEngineTests.cmake', 'cmake/**', '.github/actions/setup-core-toolchain/**', 'corelib/**', 'scripts/generate-core-abi.py', 'scripts/build-system-network-helper.sh', 'scripts/network_helper_package.py', 'scripts/windows_helper_sdk.py', 'tests/windows_helper_sdk_test.py', 'resource/network-helper*', 'tests/network_helper_package_test.py', 'tests/platform/**', '.github/workflows/coreabi.yml', '.github/actions/setup-qt/**', '.github/actions/setup-linux-apt/**']
  pull_request:
    branches: [main, develop]
    paths: *coreabi_paths
  workflow_dispatch:
    inputs:
      windows_packet_only:
        type: boolean
        default: false
        description: Run only Windows native device, ordinary Qt/core packets and application sessions
      macos_helper_only:
        type: boolean
        default: false
        description: Run only the signed macOS permission helper checks (not the full ABI matrix)
      controller_only:
        type: boolean
        default: false
        description: Run six native Go controller/DNS/underlay checks without Qt or device mutation

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-helper:
    if: github.event_name == 'workflow_dispatch' && inputs.macos_helper_only
    name: macOS helper ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-26, arch: arm64}
          - {os: macos-26-intel, arch: x64}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-qt
        with:
          host: mac
          arch: clang_64
      - uses: ./.github/actions/setup-core-toolchain
      - name: Verify signed helper and independent recovery
        run: bash tests/platform/run_macos_networkhelper.sh
      - name: Upload native helper evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-helper-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/coreabi/*.txt
            build/coreabi/macos-helper.log
            build/coreabi/macos-original-dns.log
            build/coreabi/macos-tun-dns.log
            build/coreabi/macos-tun-routes.log
            build/coreabi/macos-helper/*.out
            build/coreabi/macos-helper/*.err
            build/coreabi/macos-helper/*.json
            build/controller-checks/*.log
  probe:
    if: github.event_name != 'workflow_dispatch' || (!inputs.macos_helper_only && !inputs.windows_packet_only && !inputs.controller_only)
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: &native_platforms
        include:
          - &windows_x64 {os: windows-2025, platform: windows, arch: x64, qt_host: windows, qt_arch: win64_msvc2022_64}
          - &windows_arm64 {os: windows-11-vs2026-arm, platform: windows, arch: arm64, qt_host: windows_arm64, qt_arch: win64_msvc2022_arm64}
          - {os: macos-26-intel, platform: macos, arch: x64, qt_host: mac, qt_arch: clang_64}
          - {os: macos-26, platform: macos, arch: arm64, qt_host: mac, qt_arch: clang_64}
          - {os: ubuntu-26.04, platform: linux, arch: x64, qt_host: linux, qt_arch: linux_gcc_64}
          - {os: ubuntu-26.04-arm, platform: linux, arch: arm64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build Windows native backends before toolchain setup
        if: runner.os == 'Windows'
        run: &windows_native_probe |
          New-Item -ItemType Directory -Force build/coreabi | Out-Null
          python tests/platform/run_windows_packet.py --build-only 2>&1 | Tee-Object -FilePath build/coreabi/windows-native-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: ./.github/actions/setup-linux-apt
        if: runner.os == 'Linux'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env NEEDRESTART_MODE=l apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libevent-dev libminizip-dev gsettings-desktop-schemas gnome-keyring dbus-daemon dbus-bin libglib2.0-bin libkf6config-bin qt6-base-dev dpkg-dev systemd-resolved

      - uses: ./.github/actions/setup-qt
        with:
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}

      - uses: ./.github/actions/setup-core-toolchain

      - name: Verify ordinary Qt Windows authorization and recovery control
        if: runner.os == 'Windows'
        run: python tests/platform/run_windows_helper.py --qt-control

      - &windows_device_probe
        name: Probe Windows device broker in the disposable runner
        id: windows_device_probe
        if: runner.os == 'Windows'
        run: python tests/platform/run_windows_packet.py --device-only

      - name: Verify signed macOS network helper and independent recovery
        if: runner.os == 'macOS'
        shell: bash
        run: bash tests/platform/run_macos_networkhelper.sh

      - name: Stage pinned Mihomo for native control-DNS integration
        if: &collect_native_evidence ${{ !cancelled() && (success() || (runner.os == 'Windows' && steps.windows_device_probe.outcome == 'failure')) }}
        run: python tests/platform/setup_mihomo.py --target ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify ordinary control beneath a live rejecting Mihomo TUN
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l tests/platform/mihomo_tun_probe.go)"
          go -C corelib vet ../tests/platform/mihomo_tun_probe.go
          go -C corelib build -mod=readonly -o ../build/coreabi/mihomo-tun-probe ../tests/platform/mihomo_tun_probe.go
          sudo unshare --net -- "$(command -v python)" tests/platform/mihomo_tun_linux.py --uid "$(id -u)" --probe build/coreabi/mihomo-tun-probe --mihomo "$JC_TEST_MIHOMO_BINARY" 2>&1 | tee build/coreabi/linux-mihomo-tun.log

      - name: Verify formal C ABI, protocol session and authentication
        if: *collect_native_evidence
        timeout-minutes: 20
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          output = pathlib.Path('build/coreabi')
          output.mkdir(parents=True, exist_ok=True)
          def run(name, args, required=True):
              sys.stdout.buffer.write(('RUN: ' + name + '\n').encode())
              sys.stdout.buffer.flush()
              with (output / (name + '.log')).open('wb') as log:
                  with subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT) as process:
                      for chunk in iter(lambda: process.stdout.read1(4096), b''):
                          log.write(chunk)
                          log.flush()
                          sys.stdout.buffer.write(chunk)
                          sys.stdout.buffer.flush()
                      status = process.wait()
              if status and required:
                  sys.exit(status)
              return status
          run('mihomo-runtime-unit', [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests/platform', '-p', 'setup_mihomo_test.py'])
          run('go', ['go', 'version'])
          run('cgo-env', ['go', 'env', 'GOHOSTOS', 'GOHOSTARCH', 'CC', 'CGO_ENABLED'])
          run('cc', [os.environ['CC'], '--version'])
          run('constants', [sys.executable, 'scripts/generate-core-abi.py', '--check'])
          run('go-test', ['go', '-C', 'corelib', 'test', '-json', '-timeout', '90s', './...'])
          race_status = shutdown_status = 0
          if not (os.environ['RUNNER_OS'] == 'Windows' and os.environ['RUNNER_ARCH'] == 'ARM64'):
              # Collect independent ABI results even when a race regression fails; the step still fails below.
              # Serialize packages; retain the platform's CPU and parallel-test budgets.
              race_status = run('go-race', ['go', '-C', 'corelib', 'test', '-json', '-race', '-p', '1', '-timeout', '90s', './...'], required=False)
              # Repeat the observed shutdown regression without relaxing its per-close deadline.
              shutdown_status = run('go-race-tun-shutdown', ['go', '-C', 'corelib', 'test', '-json', '-race', '-count', '5',
                  '-timeout', '90s', '-run', '^TestTUNBoundsFlowsAndJoinsFullCapacityOnShutdown$', './service'], required=False)
          else:
              print('UNSUPPORTED: Go race detector on Windows ARM64; normal Go and C ABI tests still run', flush=True)
          args = ['cmake', '-S', 'tests/coreabi', '-B', str(output), '-DCMAKE_BUILD_TYPE=Release']
          if sys.platform == 'win32':
              args += ['-A', 'ARM64' if os.environ['RUNNER_ARCH'] == 'ARM64' else 'x64']
          run('configure', args)
          run('build', ['cmake', '--build', str(output), '--config', 'Release', '--parallel', '3', '--verbose'])
          run('host', ['ctest', '--test-dir', str(output), '-C', 'Release', '-V', '--output-on-failure'])
          sys.exit(race_status or shutdown_status)

      - name: Check Linux TUN fd transfer and cleanup in an isolated network
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- "$(command -v python)" tests/platform/unix_device_probe.py --uid "$(id -u)" --allocator build/coreabi/linux_tundevice_test 2>&1 | tee build/coreabi/linux-device.log

      - name: Verify ordinary native TUN traffic through the formal C ABI
        if: runner.os == 'Linux'
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOEXPERIMENT: cgocheck2
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOENV: 'off'
        run: |
          go -C corelib test -c -o ../build/coreabi/native-tun-host ./internal/bridge
          go -C corelib test -race -c -o ../build/coreabi/native-tun-fd ./internal/tundevice/linux
          sudo unshare --net -- env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" tests/platform/tun_coreabi_unix.py --uid "$(id -u)" --allocator build/coreabi/linux_tundevice_test --gateway build/coreabi/native-tun-host --host build/coreabi/coreabi_test --fd-test build/coreabi/native-tun-fd 2>&1 | tee build/coreabi/linux-tun-coreabi.log

      - name: Check original Go underlay beneath a competing Linux TUN route
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l tests/platform/original_route_probe.go)"
          go -C corelib vet ../tests/platform/original_route_probe.go
          go -C corelib build -mod=readonly -o ../build/coreabi/original-route-probe ../tests/platform/original_route_probe.go
          sudo unshare --net -- "$(command -v python)" tests/platform/original_route_linux.py --uid "$(id -u)" --probe build/coreabi/original-route-probe --allocator build/coreabi/linux_tundevice_test --routes build/coreabi/linux_sourceroutes_test 2>&1 | tee build/coreabi/linux-original-route.log

      - name: Check owned Linux source tables and rules in an isolated network
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- build/coreabi/linux_sourceroutes_test --isolated 2>&1 | tee build/coreabi/linux-source-routes.log

      - name: Check protected Linux source ownership journal in an isolated network
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- build/coreabi/linux_sourcejournal_test --isolated 2>&1 | tee build/coreabi/linux-source-journal.log

      - name: Check owned Linux capture routes and partial recovery in an isolated network
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- build/coreabi/linux_tunroutes_test --isolated 2>&1 | tee build/coreabi/linux-owned-routes.log

      - name: Check authenticated Linux helper fd handoff and independent recovery
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" tests/platform/networkhelper_linux.py --uid "$(id -u)" --helper build/coreabi/linux_networkhelper_test 2>&1 | tee build/coreabi/linux-network-helper.log

      - name: Check owned Linux DNS and crash recovery with an isolated system resolver
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --mount --net -- env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" tests/platform/tundns_linux.py --uid "$(id -u)" --probe build/coreabi/linux_tundns_test --helper build/coreabi/linux_networkhelper_test 2>&1 | tee build/coreabi/linux-tun-dns.log

      - name: Build and verify the distribution-owned Linux permission helper
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/build-system-network-helper.sh build/coreabi/system-helper
          package=(build/coreabi/system-helper/*.deb)
          test "${#package[@]}" -eq 1
          python scripts/network_helper_package.py "${package[0]}" --revision "$GITHUB_SHA" --output build/coreabi/linux-helper-package.json
          sudo unshare --mount --net -- env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" tests/platform/networkhelper_package_linux.py --package "${package[0]}" --revision "$GITHUB_SHA" --uid "$(id -u)" --client build/coreabi/linux_networkhelperclient_test --authorization-fixture build/coreabi/linux_authorization_fixture --gateway build/coreabi/native-tun-host --tun-adapter build/coreabi/coreabi_tun_adapter_test 2>&1 | tee build/coreabi/linux-installed-helper.log

      - name: Check macOS utun fd transfer and cleanup in the disposable runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_OS="$RUNNER_OS" build/coreabi/macos_tunroutes_test --isolated 2>&1 | tee build/coreabi/macos-routes.log
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_OS="$RUNNER_OS" "$(command -v python)" tests/platform/unix_device_probe.py --uid "$(id -u)" --allocator build/coreabi/macos_tundevice_test 2>&1 | tee build/coreabi/macos-device.log

      - name: Verify ordinary macOS utun traffic through the formal C ABI
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOEXPERIMENT: cgocheck2
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOENV: 'off'
        run: |
          go -C corelib test -c -o ../build/coreabi/native-tun-host ./internal/bridge
          go -C corelib test -race -c -o ../build/coreabi/native-tun-fd ./internal/tundevice/macos
          sudo env PYTHONDONTWRITEBYTECODE=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_OS="$RUNNER_OS" "$(command -v python)" tests/platform/tun_coreabi_unix.py --uid "$(id -u)" --allocator build/coreabi/macos_tundevice_test --gateway build/coreabi/native-tun-host --host build/coreabi/coreabi_test --fd-test build/coreabi/native-tun-fd 2>&1 | tee build/coreabi/macos-tun-coreabi.log

      # Run the upstream runtime only after the original signed SDK and native application checks.
      - name: Verify control beneath a live rejecting Mihomo TUN
        if: ${{ !cancelled() && (matrix.platform == 'windows' || matrix.platform == 'macos') && (success() || (runner.os == 'Windows' && steps.windows_device_probe.outcome == 'failure')) }}
        shell: python
        run: &native_control_tun |
          import os, pathlib, subprocess, sys
          output = pathlib.Path('build/controller-checks')
          output.mkdir(parents=True, exist_ok=True)
          probe = (output / ('mihomo-tun-probe.exe' if os.name == 'nt' else 'mihomo-tun-probe')).resolve()
          commands = [
              ['go', '-C', 'corelib', 'test', '-mod=readonly', '-count=1', './tests/mihomotun'],
              ['go', '-C', 'corelib', 'build', '-mod=readonly', '-o', str(probe), './tests/mihomotun'],
              [sys.executable, 'tests/platform/mihomo_tun_native.py', '--probe', str(probe),
               '--mihomo', os.environ['JC_TEST_MIHOMO_BINARY'], '--url', 'https://github.com/robots.txt'],
          ]
          path = output / 'live-tun.log'
          try:
              with path.open('wb') as log:
                  for command in commands:
                      subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=115)
          finally:
              sys.stdout.buffer.write(path.read_bytes())
              sys.stdout.buffer.flush()

      # Collect independent ABI/application evidence, but keep the original device probe mandatory.
      - &windows_device_result
        name: Enforce required Windows device result
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_device_probe.outcome != 'success' }}
        shell: pwsh
        run: throw 'Required Windows native device/4096-packet check failed or did not run; see its original log.'

      - name: Upload toolchain and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coreabi-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/coreabi/*.log
            build/coreabi/*.txt
            build/coreabi/*.json
            build/coreabi/Testing/Temporary/*.log
            build/coreabi/macos-helper/*.out
            build/coreabi/macos-helper/*.err
            build/coreabi/macos-helper/*.json

  controller:
    if: github.event_name == 'workflow_dispatch' && inputs.controller_only
    name: Controller ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: *native_platforms
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-core-toolchain
      - name: Stage pinned Mihomo for native control-DNS integration
        run: python tests/platform/setup_mihomo.py --target ${{ matrix.platform }}-${{ matrix.arch }}
      - name: Verify native controller, DNS and shared underlay
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          output = pathlib.Path('build/controller-checks')
          output.mkdir(parents=True, exist_ok=True)
          checks = [('normal', [])]
          if not (os.environ['RUNNER_OS'] == 'Windows' and os.environ['RUNNER_ARCH'] == 'ARM64'):
              checks.append(('race', ['-race']))
          else:
              print('UNSUPPORTED: Go race detector on Windows ARM64; native normal checks still run', flush=True)
          for name, flags in checks:
              print('RUN: native controller ' + name, flush=True)
              path = output / (name + '.log')
              command = ['go', '-C', 'corelib', 'test', '-json', '-mod=readonly', '-count=1', '-timeout=90s', *flags,
                         './underlay', './internal/mihomo/...', './internal/dialer']
              with path.open('wb') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
              sys.stdout.buffer.write(path.read_bytes())
              sys.stdout.buffer.flush()
              if result.returncode:
                  sys.exit(result.returncode)
      - name: Verify control beneath a live rejecting Mihomo TUN
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        shell: python
        run: *native_control_tun
      - name: Upload native controller evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: controller-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: build/controller-checks/*.log

  windows-packet:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_packet_only
    name: Windows packet ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - *windows_x64
          - *windows_arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build Windows native backends before toolchain setup
        run: *windows_native_probe
      - uses: ./.github/actions/setup-qt
        with:
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
      - uses: ./.github/actions/setup-core-toolchain
      - name: Verify ordinary Qt authorization and recovery control
        run: python tests/platform/run_windows_helper.py --qt-control
      - *windows_device_probe
      - name: Verify ordinary Qt/core packets and application sessions
        if: *collect_native_evidence
        run: python tests/platform/run_windows_packet.py --core-only
      - *windows_device_result
      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-packet-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/coreabi/*.txt
            build/coreabi/*.json
            build/coreabi/*.log
            build/coreabi/Testing/Temporary/LastTest.log
