name: Build packages
run-name: ${{ github.ref == 'refs/heads/develop' && 'Development preview' || 'Build packages' }} (${{ github.ref_name }})

on:
  push:
    branches: [main]

  release:
    types: [published]
  workflow_dispatch:
    inputs:
      nightly:
        type: boolean
        default: true
        description: Nightly build (develop previews always use this mode)
      version:
        type: string
        default: ''
        description: Version for a non-nightly main build (e.g. v0.1.0)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  TARGET_NAME: JustConnect
  DISPLAY_NAME: JustConnect

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, platform: windows, arch: x64, qt_host: windows, qt_arch: win64_msvc2022_64}
          - {os: windows-11-vs2026-arm, platform: windows, arch: arm64, qt_host: windows_arm64, qt_arch: win64_msvc2022_arm64}
          - {os: macos-26-intel, platform: macos, arch: x64, native_arch: x86_64, qt_host: mac, qt_arch: clang_64}
          - {os: macos-26, platform: macos, arch: arm64, native_arch: arm64, qt_host: mac, qt_arch: clang_64}
          - {os: ubuntu-26.04, platform: linux, arch: x64, native_arch: x86_64, qt_host: linux, qt_arch: linux_gcc_64}
          - {os: ubuntu-26.04-arm, platform: linux, arch: arm64, native_arch: arm64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64}
    env:
      ARCHIVE_NAME: JustConnect-${{ github.ref == 'refs/heads/develop' && format('preview-{0}', github.sha) || inputs.version || github.event.release.tag_name || 'nightly' }}-${{ matrix.platform }}-${{ matrix.arch }}
      NIGHTLY_BUILD: ${{ github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && inputs.nightly) || (github.event_name != 'workflow_dispatch' && github.event_name != 'release') }}
      RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
      MACOS_SIGNING: ${{ github.ref != 'refs/heads/develop' && matrix.platform == 'macos' && secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_CERT_IDENTITY != '' }}
      MACOS_NOTARIZATION: ${{ github.ref != 'refs/heads/develop' && matrix.platform == 'macos' && secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_CERT_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libevent-dev libminizip-dev

      - name: Install Qt
        uses: ./.github/actions/setup-qt
        with:
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}

      - name: Prepare Go and cgo toolchain
        uses: ./.github/actions/setup-core-toolchain

      - name: Verify module, formatting, vet and packaging checks
        shell: bash
        run: |
          python scripts/test-corelib.py
          python -m unittest discover -s tests -p '*_test.py'

      - name: Configure
        shell: bash
        env:
          BUILD_ARCH: ${{ matrix.native_arch }}
        run: |
          if [[ "$NIGHTLY_BUILD" == 'true' ]]; then
            short_revision=$(git rev-parse --short=7 HEAD)
            version_args=(-DNIGHTLY_BUILD=ON "-DGIT_HASH=$short_revision")
            echo "APP_VERSION=$short_revision-nightly" >> "$GITHUB_ENV"
          else
            if [[ ! "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo 'A release version such as v0.1.0 is required.' >&2
              exit 1
            fi
            version_args=(-DNIGHTLY_BUILD=OFF "-DREL_VER=${RELEASE_VERSION#v}")
            echo "APP_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"
          fi
          platform_args=()
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            platform_args=("-DCMAKE_OSX_ARCHITECTURES=$BUILD_ARCH")
          fi
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release "${version_args[@]}" "${platform_args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/deploy-windows.ps1 -TargetName $env:TARGET_NAME -DisplayName $env:DISPLAY_NAME -BuildDir build
          Compress-Archive -Path $env:DISPLAY_NAME -DestinationPath "$env:ARCHIVE_NAME.zip"
          Expand-Archive -Path "$env:ARCHIVE_NAME.zip" -DestinationPath "$env:RUNNER_TEMP/package-check"
          $package = "$env:RUNNER_TEMP/package-check/$env:DISPLAY_NAME"
          python scripts/verify-package.py $package "$package/$env:TARGET_NAME.exe" --revision $env:GITHUB_SHA --version $env:APP_VERSION --archive "$env:ARCHIVE_NAME.zip" --output "build/$env:ARCHIVE_NAME.json"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged application verification failed' }

      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          NATIVE_ARCH: ${{ matrix.native_arch }}
        run: |
          ./scripts/deploy-linux.sh "$TARGET_NAME" "$DISPLAY_NAME" build "$NATIVE_ARCH"
          mv "$TARGET_NAME"-*.AppImage "$ARCHIVE_NAME.AppImage"
          package_check=$(mktemp -d)
          (cd "$package_check" && "$GITHUB_WORKSPACE/$ARCHIVE_NAME.AppImage" --appimage-extract > /dev/null)
          python scripts/verify-package.py "$package_check/squashfs-root" "$package_check/squashfs-root/usr/bin/$TARGET_NAME" --revision "$GITHUB_SHA" --version "$APP_VERSION" --archive "$ARCHIVE_NAME.AppImage" --output "build/$ARCHIVE_NAME.json"
          rm -rf "$package_check"

      - name: Prepare macOS bundle
        if: runner.os == 'macOS'
        env:
          NATIVE_ARCH: ${{ matrix.native_arch }}
        run: ./scripts/deploy-macos.sh "$TARGET_NAME" build "$NATIVE_ARCH"

      - name: Import macOS signing certificate
        if: env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-keychain
        run: |
          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db"

      - name: Sign macOS bundle
        if: runner.os == 'macOS'
        env:
          CODESIGN_IDENTITY: ${{ env.MACOS_SIGNING == 'true' && secrets.MACOS_CERT_IDENTITY || '-' }}
        run: |
          if [[ "$MACOS_SIGNING" != 'true' ]]; then
            echo '::notice::No Apple signing credentials; creating an ad-hoc signed test build without notarization.'
          fi
          ./scripts/macos-sign-app.sh "$TARGET_NAME.app"
          codesign --verify --deep --strict "$TARGET_NAME.app"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir dmg-root
          cp -R "$TARGET_NAME.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "$DISPLAY_NAME" -srcfolder dmg-root -format UDZO "$ARCHIVE_NAME.dmg"
          hdiutil attach "$ARCHIVE_NAME.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg-check"
          test -x "$RUNNER_TEMP/dmg-check/$TARGET_NAME.app/Contents/MacOS/$TARGET_NAME"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg-check/$TARGET_NAME.app"
          signature_args=()
          if [[ "$MACOS_SIGNING" == 'true' ]]; then signature_args=(--signed); fi
          python scripts/verify-package.py "$RUNNER_TEMP/dmg-check/$TARGET_NAME.app" "$RUNNER_TEMP/dmg-check/$TARGET_NAME.app/Contents/MacOS/$TARGET_NAME" --revision "$GITHUB_SHA" --version "$APP_VERSION" --archive "$ARCHIVE_NAME.dmg" --output "build/$ARCHIVE_NAME.json" "${signature_args[@]}"
          hdiutil detach "$RUNNER_TEMP/dmg-check"

      - name: Notarize macOS package
        if: env.MACOS_NOTARIZATION == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/macos-notarize-dmg.sh "$ARCHIVE_NAME.dmg"

      - name: Remove temporary signing credentials
        if: always() && env.MACOS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Upload package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.ARCHIVE_NAME }}.zip
            ${{ env.ARCHIVE_NAME }}.dmg
            ${{ env.ARCHIVE_NAME }}.AppImage

      - name: Upload package verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ARCHIVE_NAME }}-checks
          retention-days: 14
          path: build/${{ env.ARCHIVE_NAME }}.json

  source:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-26.04
    env:
      ARCHIVE_NAME: JustConnect-${{ github.ref == 'refs/heads/develop' && format('preview-{0}', github.sha) || inputs.version || github.event.release.tag_name || 'nightly' }}-source
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Verify corresponding-source export
        run: python -m unittest discover -s tests -p archive_source_test.py
      - name: Export maintained source tree
        run: python scripts/archive-source.py "$ARCHIVE_NAME.tar.gz"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.ARCHIVE_NAME }}.tar.gz
            ${{ env.ARCHIVE_NAME }}.tar.gz.sha256

  release:
    if: github.event_name == 'release'
    needs: [build, source]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: JustConnect-${{ github.event.release.tag_name }}-*
          merge-multiple: true
          path: packages

      - name: Upload to this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" packages/* --repo "$GITHUB_REPOSITORY"
