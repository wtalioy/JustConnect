name: Set up Qt
description: Install the Qt Widgets SDK
inputs:
  host:
    description: aqt host
    required: true
  arch:
    description: aqt architecture
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'

    - name: Install Qt SDK
      id: sdk
      uses: jurplel/install-qt-action/action@v4.4.1
      with:
        version: '6.12.0'
        host: ${{ inputs.host }}
        target: desktop
        arch: ${{ inputs.arch }}
        # lrelease in the SDK links QtQml; the application does not.
        archives: qtbase qtsvg qtdeclarative qttools qttranslations
        # Extension repositories and native ARM64 support are not in aqt 3.3.0.
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
        py7zrversion: '==1.1.4'
        cache: true
        cache-key-prefix: qt-6.12.0-widgets-v4-${{ inputs.host }}-${{ inputs.arch }}
