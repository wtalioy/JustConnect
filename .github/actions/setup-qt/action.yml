name: Set up Qt
description: Install Qt 6.12 and its compatible WebEngine candidate
inputs:
  host:
    description: aqt host
    required: true
  arch:
    description: aqt architecture
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'

    - name: Install Qt SDK
      id: sdk
      uses: jurplel/install-qt-action/action@v4.4.1
      with:
        version: '6.12.0'
        host: ${{ inputs.host }}
        target: desktop
        arch: ${{ inputs.arch }}
        archives: qtbase qtsvg qtdeclarative qttools qttranslations qtwayland icu
        modules: qt5compat qtshadertools qtpositioning qtserialport qtwebchannel
        # Extension repositories and native ARM64 support are not in aqt 3.3.0.
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
        py7zrversion: '==1.1.4'
        cache: true
        cache-key-prefix: qt-6.12.0-${{ inputs.host }}-${{ inputs.arch }}

    - name: Check WebEngine installer
      shell: bash
      run: python -m unittest discover -s tests -p install_webengine_test.py

    - name: Install compatible WebEngine candidate
      shell: bash
      env:
        QT_INSTALL_HOST: ${{ inputs.host }}
        QT_INSTALL_ARCH: ${{ inputs.arch }}
      run: python scripts/install-webengine.py
