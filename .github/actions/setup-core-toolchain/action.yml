name: Set up integrated core toolchain
description: Install the module-pinned Go toolchain and native cgo compiler
runs:
  using: composite
  steps:
    - name: Read pinned Go version
      id: go
      shell: bash
      run: python -c 'import os, pathlib; version = next(line.split()[1] for line in pathlib.Path("corelib/go.mod").read_text().splitlines() if line.startswith("go ")); open(os.environ["GITHUB_OUTPUT"], "a").write("version=" + version + "\n")'

    - uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ steps.go.outputs.version }}
        cache: true
        cache-dependency-path: corelib/go.sum

    - name: Install pinned Windows cgo compiler (UCRT)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        PROBE_ARCH: ${{ runner.arch }}
      run: |
        if ($env:PROBE_ARCH -eq 'ARM64') {
          $hostArch = 'aarch64'
          $expected = '9a835d5179c9f3a5a783c11a7f14062a249b4765dd11add64a66786864e82ab2'
        } else {
          $hostArch = 'x86_64'
          $expected = '317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a'
        }
        $name = "llvm-mingw-20261006-ucrt-$hostArch"
        $archive = "$env:RUNNER_TEMP/$name.zip"
        Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$name.zip" -OutFile $archive
        if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Compiler SHA-256 mismatch' }
        Expand-Archive $archive "$env:RUNNER_TEMP/cgo"
        "$env:RUNNER_TEMP/cgo/$name/bin" >> $env:GITHUB_PATH
        "CC=$hostArch-w64-mingw32-clang" >> $env:GITHUB_ENV

    - name: Select Unix cgo compiler
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == 'macOS' ]]; then echo 'CC=clang' >> "$GITHUB_ENV"; else echo 'CC=gcc' >> "$GITHUB_ENV"; fi
