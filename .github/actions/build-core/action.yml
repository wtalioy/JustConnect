name: Build fixed core
description: Build and verify the third-party core recorded in core/manifest.json
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-core-toolchain

    - name: Build and verify core
      shell: bash
      run: |
        python -m unittest discover -s tests -p build_core_test.py
        python scripts/build-core.py
